# ============================================================
#  Kahlo ERP — Déploiement Netlify (frontend uniquement)
#
#  ⚠ Netlify n'héberge que l'interface React (fichiers statiques).
#  Le backend (FastAPI + PostgreSQL + Redis) doit tourner sur un
#  serveur — VPS/Coolify via docker-compose (voir README).
#  Renseignez l'URL du backend dans le proxy /api/* ci-dessous.
# ============================================================

[build]
  # Le frontend vit dans le sous-dossier frontend/ — sans ce réglage,
  # Netlify ne trouve rien à builder et publie un site vide (404).
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- Proxy API ---------------------------------------------------
# Toutes les requêtes /api/* sont relayées vers le backend.
# REMPLACEZ l'URL par celle de votre serveur backend (HTTPS requis).
# Le proxy rend l'API same-origin : les cookies de session HttpOnly
# et le CSRF fonctionnent sans configuration CORS supplémentaire.
[[redirects]]
  from   = "/api/*"
  to     = "https://erp.kahlocafe.fr/api/:splat"
  status = 200
  force  = true

# --- SPA fallback ------------------------------------------------
# React Router gère les routes côté client : toute URL inconnue
# doit servir index.html (sinon 404 sur /stock, /investissements...).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# --- En-têtes de sécurité (équivalents de nginx.conf) -------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
