# ============================================================
#  Kahlo Frontend — Nginx SPA + reverse proxy interne
#  Sert les fichiers React statiques
#  Proxy les requêtes /api/ et /caldav/ vers les services Docker
# ============================================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=webhook_limit:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=caldav_limit:1m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité
    server_tokens off;
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- SumUp webhooks (rate limited) ---
    location /api/webhooks/sumup {
        limit_req zone=webhook_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- API Backend ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- CalDAV (Radicale) ---
    location /caldav/ {
        limit_req zone=caldav_limit burst=10 nodelay;
        proxy_pass http://caldav:5232/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /caldav;
        proxy_pass_header Authorization;
    }

    # --- Frontend SPA (React) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
